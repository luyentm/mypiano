<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư viện MIDI — mypiano</title>
<meta name="description" content="Danh sách bài MIDI có sẵn trong mypiano. Chọn một bài để mở màn chơi nốt rơi.">
<link rel="canonical" href="https://luyentm.github.io/mypiano/library/">
<style>
  :root{
    --bg:#0d1017; --panel:#151a24; --card:#131822; --line:#232a38;
    --text:#d3dae6; --dim:#78849a;
    --rh:#edb04a; --lh:#57a8d4;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font:400 15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-text-size-adjust:100%}
  .wrap{max-width:960px; margin:0 auto; padding:0 20px}

  nav{position:sticky; top:0; z-index:9; background:rgba(13,16,23,.86);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
  nav .wrap{display:flex; align-items:center; gap:16px; height:56px}
  nav .brand{font-weight:600; font-size:15px; color:var(--text); text-decoration:none;
    display:flex; align-items:center; gap:8px}
  nav .brand i{color:var(--rh); font-style:normal; font-size:18px}
  nav a{color:var(--dim); text-decoration:none; font-size:14px}
  nav a:hover{color:var(--text)}
  nav .spacer{margin-left:auto}

  header.top{padding:34px 0 18px}
  header.top h1{font-size:24px; margin:0 0 6px; letter-spacing:-.3px}
  header.top p{color:var(--dim); font-size:14px; margin:0}

  .tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 22px}
  #q{flex:1; min-width:180px; background:var(--card); border:1px solid var(--line);
    border-radius:9px; padding:10px 13px; color:var(--text); font:inherit; font-size:14px}
  #q:focus{outline:none; border-color:var(--lh)}
  #q::placeholder{color:var(--dim)}
  .btn{display:inline-block; border-radius:9px; padding:10px 16px; font-size:14px;
    text-decoration:none; border:1px solid var(--line); background:#202737; color:var(--text)}
  .btn:hover{background:#283147}
  .count{color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums}

  .grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    padding-bottom:40px}
  a.song{display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:11px; padding:15px 16px; position:relative}
  a.song:hover{background:#182030; border-color:#313c52}
  a.song:focus-visible{outline:2px solid var(--lh); outline-offset:2px}
  a.song .t{font-size:15px; font-weight:600; margin-bottom:3px; padding-right:26px}
  a.song .rank{color:#5c6880; font-weight:500; margin-right:5px; font-variant-numeric:tabular-nums}
  a.song .c{font-size:13px; color:var(--lh)}
  a.song .n{font-size:12.5px; color:var(--dim); margin-top:7px}
  a.song .f{font-size:11.5px; color:#5c6880; margin-top:9px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  a.song .go{position:absolute; top:14px; right:14px; color:var(--dim); font-size:15px}
  a.song:hover .go{color:var(--rh)}
  a.song .lv{display:flex; align-items:center; gap:8px; margin-top:11px}
  a.song .bar{flex:1; height:4px; border-radius:3px; background:#232a38; overflow:hidden}
  a.song .bar i{display:block; height:100%; border-radius:3px}
  a.song .num{font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  a.song .lvl{font-size:11.5px; font-weight:600; white-space:nowrap}

  .msg{border:1px dashed var(--line); border-radius:11px; padding:26px 22px; color:var(--dim);
    font-size:14px; grid-column:1/-1}
  .msg b{color:var(--text); font-weight:600; display:block; margin-bottom:7px; font-size:15px}
  .msg code{background:#0b0e14; border:1px solid var(--line); border-radius:5px;
    padding:2px 6px; font-size:12.5px; color:var(--text)}
  .msg pre{background:#0b0e14; border:1px solid var(--line); border-radius:8px; padding:11px 13px;
    overflow-x:auto; margin:11px 0 0; font-size:12.5px; color:var(--text); line-height:1.5}
  /* Link sang trang riêng từng bài. Card ở trên cố ý vẫn trỏ thẳng vào /play/ để
     bấm một cái là chơi được; khối này là đường cho Google bò tới các trang bai/,
     và là chỗ copy link đi chia sẻ. */
  section.pages{border-top:1px solid var(--line); margin:6px 0 0; padding:24px 0 44px}
  section.pages h2{font-size:15px; margin:0 0 5px; font-weight:600}
  section.pages p{color:var(--dim); font-size:13px; margin:0 0 13px}
  section.pages .pl{display:flex; flex-wrap:wrap; gap:8px}
  section.pages .pl a{background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; font-size:13px; text-decoration:none; color:var(--dim)}
  section.pages .pl a:hover{border-color:#313c52; color:var(--text)}

  .hit{position:absolute; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="../"><i>♪</i> mypiano</a>
    <span class="spacer"></span>
    <a href="../">Trang chủ</a>
    <a href="../play/">Chơi</a>
  </div>
</nav>

<div class="wrap">
  <header class="top">
    <h1>Thư viện MIDI</h1>
    <p>Xếp từ dễ tới khó — cứ theo thứ tự mà tập. File nằm trong repo, không cần upload lại mỗi lần.</p>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Tìm theo tên bài hoặc tác giả…" autocomplete="off">
    <a class="btn" href="../play/">Mở file từ máy</a>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="list"></div>

  <section class="pages" id="pages" hidden>
    <h2>Trang riêng từng bài</h2>
    <p>Mỗi bài có một trang giới thiệu riêng, tiện để gửi link cho người khác.</p>
    <div class="pl" id="plist"></div>
  </section>
</div>

<!-- Chỉ đếm vào counter TỔNG của site. Tuyệt đối không nhúng badge theo từng bài ở đây:
     hits.sh tăng đếm mỗi lần ảnh được tải, xem danh sách sẽ bị tính thành lượt tập. -->
<img class="hit" data-hit="https://hits.sh/luyentm.github.io/mypiano.svg" alt="" aria-hidden="true">

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb = n => n < 1024 ? n + ' B' : (n/1024).toFixed(1) + ' KB';

let songs = [];

/* Người dùng chọn Grand piano ở màn chơi thì giữ lựa chọn đó khi đổi bài
   (không dùng localStorage, nên truyền qua URL). */
const TONE = new URLSearchParams(location.search).get('tone') === 'grand' ? 'grand' : '';
const withTone = qs => qs + (TONE ? (qs ? '&' : '?') + 'tone=grand' : '');

/* Độ khó 1–1000 do người chấm, ghi trong midi/meta.json. Danh sách đã được
   tools/build-midi-index.js sắp sẵn theo số này nên ở đây giữ nguyên thứ tự. */
const BANDS = [
  [150, 'Rất dễ',   '#6fc38a'],
  [300, 'Dễ',       '#8ec36f'],
  [450, 'Vừa',      '#edb04a'],
  [600, 'Khá khó',  '#e08e4a'],
  [750, 'Khó',      '#e0704a'],
  [1001,'Rất khó',  '#d95a6a']
];
const band = d => BANDS.find(b => d < b[0]) || BANDS[BANDS.length-1];

function card(s, rank){
  const [, label, color] = band(s.difficulty);
  return '<a class="song" href="../play/' + withTone('?song=' + encodeURIComponent(s.file)) + '">' +
    '<span class="go">›</span>' +
    '<div class="t"><span class="rank">' + rank + '.</span>' + esc(s.title) + '</div>' +
    (s.composer ? '<div class="c">' + esc(s.composer) + '</div>' : '') +
    (s.note ? '<div class="n">' + esc(s.note) + '</div>' : '') +
    '<div class="lv">' +
      '<span class="lvl" style="color:' + color + '">' + label + '</span>' +
      '<span class="bar"><i style="width:' + (s.difficulty/10) + '%;background:' + color + '"></i></span>' +
      '<span class="num">' + s.difficulty + '/1000</span>' +
    '</div>' +
    '<div class="f">' + esc(s.file) + ' · ' + kb(s.bytes || 0) + '</div>' +
  '</a>';
}

function render(){
  const q = $('q').value.trim().toLowerCase();
  const hit = songs.filter(s =>
    !q || (s.title + ' ' + s.composer + ' ' + s.file).toLowerCase().includes(q));

  $('count').textContent = songs.length
    ? (q ? hit.length + '/' + songs.length + ' bài' : songs.length + ' bài')
    : '';

  if (!songs.length){
    $('list').innerHTML = '<div class="msg"><b>Thư viện đang trống</b>' +
      'Bỏ file <code>.mid</code> vào folder <code>midi/</code>, khai tên và độ khó (1–1000) trong ' +
      '<code>midi/meta.json</code> rồi push lên — CI tự dựng lại danh sách và xếp từ dễ tới khó.' +
      '<pre>cp bai-cua-toi.mid midi/\nnode tools/analyze-midi.js midi/bai-cua-toi.mid\n# chấm difficulty rồi thêm vào midi/meta.json\ngit add midi/ &amp;&amp; git commit -m "them bai" &amp;&amp; git push</pre></div>';
    return;
  }
  if (!hit.length){
    $('list').innerHTML = '<div class="msg"><b>Không có bài nào khớp</b>Thử từ khoá khác xem sao.</div>';
    return;
  }
  $('list').innerHTML = hit.map(s => card(s, songs.indexOf(s) + 1)).join('');
}

/* Slug phải khớp Y HỆT tools/build-pages.js, lệch một chữ là link 404. */
const slugOf = f => f.replace(/\.midi?$/i, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

function renderPages(){
  if (!songs.length) return;
  $('plist').innerHTML = songs
    .map(s => '<a href="../bai/' + slugOf(s.file) + '/">' + esc(s.title) + '</a>').join('');
  $('pages').hidden = false;
}

function failed(err){
  $('list').innerHTML = '<div class="msg"><b>Không đọc được danh sách bài</b>' +
    esc(err) + '<br>Nếu bạn đang mở file bằng <code>file://</code> thì trình duyệt chặn fetch — ' +
    'chạy qua http là được:' +
    '<pre>python3 -m http.server 1234\n# rồi mở http://localhost:1234/library/</pre></div>';
}

if (TONE) for (const a of document.querySelectorAll('a[href="../play/"]')) a.href = '../play/?tone=grand';

fetch('../midi/index.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => { songs = data.songs || []; render(); renderPages(); })
  .catch(e => failed(e.message));

$('q').oninput = render;

/* hits.sh cộng 1 mỗi lần ảnh .svg được tải, mà URL badge hardcode tên miền thật —
   mở localhost lúc dev cũng bị tính, số liệu thành vô nghĩa. Chỉ gắn src trên site thật. */
for (const el of document.querySelectorAll('img[data-hit]')){
  if (location.hostname === 'luyentm.github.io') el.src = el.dataset.hit;
  else (el.closest('a') || el).remove();
}
</script>
</body>
</html>
