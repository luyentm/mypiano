<!-- Counter TỔNG của site, giống hệt trang chủ và thư viện -->
<img class="hit" data-hit="https://hits.sh/luyentm.github.io/mypiano.svg" alt="" aria-hidden="true">

<script>
"use strict";

/* ==========================================================================
   1) PARSER STANDARD MIDI FILE — format 0 & 1
      Đọc note on/off, set tempo (0x51), time signature (0x58);
      bỏ qua meta/sysex còn lại. Trả về nốt với thời gian tính bằng GIÂY.
   ========================================================================== */
function parseMidi(buf){
  const dv = new DataView(buf);
  let p = 0;
  const u8  = () => dv.getUint8(p++);
  const u16 = () => { const v = dv.getUint16(p); p += 2; return v; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const str = n => { let s = ''; for (let i=0;i<n;i++) s += String.fromCharCode(dv.getUint8(p++)); return s; };
  /* variable-length quantity */
  const vlq = () => { let v = 0, b; do { b = u8(); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

  if (str(4) !== 'MThd') throw new Error('không phải file MIDI (thiếu MThd)');
  const headLen = u32();
  u16();                       /* format 0 / 1 — cách đọc track giống nhau */
  const ntrk = u16();
  const div  = u16();
  p += headLen - 6;            /* header dài hơn 6 byte thì bỏ phần dư */
  if (div & 0x8000) throw new Error('file dùng SMPTE timing — chưa hỗ trợ');
  const ppq = div;

  const tempos = [{ tick:0, us:500000 }];   /* mặc định 120bpm */
  const sigs   = [{ tick:0, num:4, den:4 }];
  const trackNames = [];
  const pedalRaw = [];                          /* CC64: sustain pedal */
  const raw = [];
  let trackIdx = 0, maxTick = 0;

  while (trackIdx < ntrk && p + 8 <= dv.byteLength){
    const id = str(4), len = u32();
    if (id !== 'MTrk'){ p += len; continue; }
    const end = Math.min(p + len, dv.byteLength);
    const T = trackIdx++;
    let tick = 0, running = 0;
    const active = new Map();               /* midi -> {tick, vel} */

    const closeNote = n => {
      const a = active.get(n); if (!a) return;
      if (tick > a.tick) raw.push({ tick:a.tick, endTick:tick, midi:n, vel:a.vel, track:T });
      active.delete(n);
    };

    while (p < end){
      tick += vlq();
      let status = dv.getUint8(p);
      if (status & 0x80){ p++; running = status; } else status = running;   /* running status */
      if (!status){ p++; continue; }
      const type = status & 0xf0;

      if (status === 0xff){                 /* meta */
        const meta = u8(), mlen = vlq();
        if (meta === 0x51 && mlen === 3)
          tempos.push({ tick, us:(dv.getUint8(p)<<16)|(dv.getUint8(p+1)<<8)|dv.getUint8(p+2) });
        else if (meta === 0x58 && mlen >= 2)
          sigs.push({ tick, num:dv.getUint8(p), den:Math.pow(2, dv.getUint8(p+1)) });
        else if (meta === 0x03 && !trackNames[T]){          /* tên track: dùng để đoán tay */
          let nm = ''; for (let i=0;i<mlen;i++) nm += String.fromCharCode(dv.getUint8(p+i));
          trackNames[T] = nm.trim();
        }
        p += mlen;
      } else if (status === 0xf0 || status === 0xf7){   /* sysex */
        p += vlq();
      } else if (type === 0x90){
        const n = u8(), v = u8();
        if (v > 0){ closeNote(n); active.set(n, { tick, vel:v }); } else closeNote(n);
      } else if (type === 0x80){ const n = u8(); u8(); closeNote(n);
      } else if (type === 0xb0){
        const cc = u8(), v = u8();
        if (cc === 64) pedalRaw.push({ tick, down: v >= 64 });
      } else if (type === 0xa0 || type === 0xe0){ p += 2;
      } else if (type === 0xc0 || type === 0xd0){ p += 1;
      } else p++;
    }
    for (const n of [...active.keys()]) closeNote(n);   /* nốt treo ở cuối track */
    if (tick > maxTick) maxTick = tick;
    p = end;
  }

  /* Có file (PhotoScore xuất) đặt tempo/nhịp ở CUỐI track meta chứ không phải tick 0 —
     Spring Time là ví dụ: tempo 80 nằm ở tick 45696, nên 40% đầu bài chạy ở 120 mặc
     định, nhanh hơn 1.5 lần. Không có tempo ở tick 0 thì lùi mốc đầu tiên về 0:
     file cố tình chạy 120 thì nó không khai tempo, chứ không khai ở giữa bài. */
  if (tempos.length > 1 && tempos[1].tick > 0){
    tempos.sort((a,b) => a.tick - b.tick);
    tempos[0].us = tempos[1].us;               /* tempos[0] là mốc mặc định ở tick 0 */
    tempos.splice(1, 1);
  }
  if (sigs.length > 1 && sigs[1].tick > 0){
    sigs.sort((a,b) => a.tick - b.tick);
    sigs[0].num = sigs[1].num; sigs[0].den = sigs[1].den;
    sigs.splice(1, 1);                         /* bỏ mốc trùng: để lại thì lúc chạy qua
                                                  nó reset `beat` và sinh vạch ô nhịp giả */
  }

  /* tempo map: tick -> giây (tích luỹ theo từng đoạn tempo) */
  tempos.sort((a,b) => a.tick - b.tick);
  const tm = []; let sec = 0, pt = 0, pu = 500000;
  for (const t of tempos){
    sec += (t.tick - pt) / ppq * (pu / 1e6);
    tm.push({ tick:t.tick, sec, us:t.us });
    pt = t.tick; pu = t.us;
  }
  const tickToSec = tk => {
    let lo = 0, hi = tm.length - 1, i = 0;
    while (lo <= hi){ const m = (lo+hi) >> 1; if (tm[m].tick <= tk){ i = m; lo = m+1; } else hi = m-1; }
    return tm[i].sec + (tk - tm[i].tick) / ppq * (tm[i].us / 1e6);
  };

  const notes = raw.map(n => ({
    start: tickToSec(n.tick), end: tickToSec(n.endTick),
    midi: n.midi, vel: n.vel, track: n.track
  })).filter(n => n.end > n.start && n.midi >= 12 && n.midi <= 120);
  if (!notes.length) throw new Error('file không chứa nốt nào đọc được');

  /* lưới phách / ô nhịp suy ra từ time signature */
  sigs.sort((a,b) => a.tick - b.tick);
  const grid = [];
  let si = 0, tick = 0, bar = 1, beat = 0;
  while (tick <= maxTick + ppq*4 && grid.length < 20000){
    while (si+1 < sigs.length && sigs[si+1].tick <= tick){ si++; beat = 0; }
    const s = sigs[si], ticksPerBeat = ppq * 4 / s.den;
    grid.push({ sec: tickToSec(tick), bar: beat === 0, num: bar });
    tick += ticksPerBeat; beat++;
    if (beat >= s.num){ beat = 0; bar++; }
  }
  /* Mốc đạp/nhả pedal, đã bỏ các event lặp lại cùng trạng thái (file có track
     nhân bản thì mỗi bản đều mang pedal y hệt nhau). */
  pedalRaw.sort((a, b) => a.tick - b.tick);
  const pedal = [];
  for (const e of pedalRaw){
    if (pedal.length && pedal[pedal.length - 1].down === e.down) continue;
    pedal.push({ sec: tickToSec(e.tick), down: e.down });
  }

  return { notes, grid, trackNames, pedal };
}

/* ==========================================================================
   2) STATE
   ========================================================================== */
const A0 = 21, C8 = 108;
const BLACK = [1,3,6,8,10];
const isBlack = m => BLACK.indexOf(m % 12) !== -1;

let notes = [], grid = [], duration = 0, maxDur = 0;
let loMidi = A0, hiMidi = C8;

let playing = false, rate = 1, lookahead = 3.5;
let seekOffset = 0, startedAt = 0, schedIdx = 0;

const fall = document.getElementById('fall'), fctx = fall.getContext('2d');
const keys = document.getElementById('keys'), kctx = keys.getContext('2d');
let W = 0, HF = 0, HK = 0, dpr = 1, geom = {}, lastKeySig = null;
let octBands = [];                             /* dải quãng tám, dựng cùng bảng phím */

const $   = id => document.getElementById(id);
const css = v  => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const handCol = h => css(h === 1 ? '--lh' : '--rh');

/* Gợi ý phím sắp phải bấm: phím trên bàn phím sáng dần lên khi nốt rơi tới gần.
   Người tập cần biết "bấm phím nào, ngay bây giờ" chứ không cần đọc tên nốt. */
/* Hiệu ứng nốt chạm phím: tia sáng bật lên + vệt loé ở vạch chạm, kiểu Synthesia.
   Vật lý hạt lấy delta của rAF — được phép, vì đây là thứ trang trí, không dính
   tới đồng hồ bài nhạc (đồng hồ đó vẫn chỉ lấy từ audioCtx.currentTime). */
let showFx = true;
let parts = [], flashes = [], prevOn = new Set(), fxSkip = false;
const MAX_PARTS = 420;

/* Gợi ý phím có BỐN chế độ (combo box, không còn là bật/tắt):
     note = hiện TÊN nốt (như cũ)  ·  abs = số phím 1–88  ·  deg = số bậc theo C 1–7  ·  off
   Chỗ khó nhất của người tập piano là ĐỌC bản nhạc, không phải nhớ bài. Hai chế độ
   số nhắm đúng chỗ đó: mắt đọc một con số rồi tìm thẳng ra phím, không phải đi
   đường vòng qua tên nốt. Chế độ số in số lên CẢ phím LẪN thân nốt đang rơi. */
let hintMode = 'note';
const hintOn  = () => hintMode !== 'off';
const numMode = () => hintMode === 'abs' || hintMode === 'deg';
let showScope = true;                          /* phủ xám phím ngoài ô nhịp đang chơi */
/* Đoạn lặp — khai ở đây vì ResizeObserver có thể bắn layoutLoop() trước khi
   chạy tới mục transport, mà `let` thì chưa khởi tạo là lỗi TDZ. */
const LOOP_MIN = 1.5;                          /* đoạn ngắn hơn thì lặp thành tiếng lụp bụp */
let loopA = 0, loopB = 0;
/* Lặp bật khi đoạn HẸP HƠN cả bài — một đầu thôi cũng được. Bản đầu đòi B phải
   nhỏ hơn cuối bài, nên kéo riêng đầu A ("từ giây 7.5 tới hết, lặp lại") không
   bật được lặp. */
const loopOn = () => loopB - loopA >= LOOP_MIN &&
  (loopA > 0.05 || loopB < duration - 0.05);

const NUM_SIZES = [15, 12, 10, 8];              /* nấc cỡ chữ số phím, to → nhỏ */
const numSize = (w, h) => {                    /* nấc lớn nhất vừa cả bề ngang lẫn chiều cao */
  const cap = Math.min(w * 0.62, h * 0.78);
  for (const s of NUM_SIZES) if (cap >= s) return s;
  return 0;                                    /* thân nốt bé quá, không in */
};

const HINT_LEAD = 1.2;                         /* giây: bắt đầu nhen sáng từ đây */
/* Tên nốt in ở ĐÁY phím đang được gợi ý. Màu chữ CỐ ĐỊNH — đen trên phím trắng,
   trắng trên phím đen — không đổi theo độ sáng highlight, để lúc nào cũng đọc được.
   Phím C đã có sẵn nhãn quãng tám (C4…) nên không in đè thêm. */
const NAME_LETTER = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NAME_SOLFA  = ['Đô','Đô#','Rê','Rê#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
let noteLang = 'solfa';                        /* trẻ Việt học solfège, không học chữ cái */
const keyName = m => (noteLang === 'solfa' ? NAME_SOLFA : NAME_LETTER)[m % 12];
const octName = m => keyName(m) + (Math.floor(m / 12) - 1);
/* Hai cách đánh số. `abs`: số tuyệt đối 1–88 theo thứ tự phím thật (A0 = 1, C8 = 88)
   — mỗi số ứng đúng MỘT phím, nên đọc số là ra phím, không cần biết quãng tám.
   `deg`: số bậc theo C (C=1 D=2 E=3 F=4 G=5 A=6 B=7) — mọi C đều là 1, còn quãng tám
   thì VỊ TRÍ cột nốt rơi tự nói ra. Phím đen mang dấu # của bậc ngay dưới nó. */
const DEG_TXT = ['1','1#','2','2#','3','4','4#','5','5#','6','6#','7'];
const numText = m => hintMode === 'abs' ? String(m - 20) : DEG_TXT[m % 12];
/* Đô giữa (C4) là mốc neo mọi giáo trình vỡ lòng dạy tìm trước tiên. In nhãn của
   nó trong một viên thuốc đậm để phân biệt với các Đô khác — không thêm ký hiệu mới
   nào, chỉ làm nổi cái nhãn đã có. */
/* Co tới đây là DỪNG, chữ có chìa ra ngoài phím cũng kệ. Bản cũ bỏ không vẽ khi
   phải co dưới 6.5px, nên trên iPad/điện thoại — chỗ phím hẹp nhất — nhãn dài
   ("Sol#", "Đô#") thỉnh thoảng biến mất đúng lúc cần đọc nhất. Nhãn nhỏ vẫn đọc
   được; nhãn không có thì không. */
const LABEL_MIN = 6.5;
const labFont = fs => kctx.font = '700 ' + fs + 'px system-ui,-apple-system,sans-serif';

function keyBadge(txt, cx, y, room){
  let fs = Math.min(Math.max(room * 0.46, 7), 11);
  labFont(fs);
  let w = kctx.measureText(txt).width;
  if (w > room - 6){
    fs = Math.max(fs * (room - 6) / w, LABEL_MIN);
    labFont(fs);
    w = kctx.measureText(txt).width;
  }
  const pw = w + 7, ph = fs + 5;
  kctx.fillStyle = '#1b202b';
  rrect(kctx, cx - pw / 2, y - ph + 3, pw, ph, ph / 2); kctx.fill();
  kctx.fillStyle = '#e6e2d8';
  kctx.fillText(txt, cx, y);
}

function keyLabel(txt, cx, y, room, max, color, pad){
  let fs = Math.min(Math.max(room * 0.5, 7), max);
  labFont(fs);
  let w = kctx.measureText(txt).width;
  if (w > room){
    fs = Math.max(fs * room / w, LABEL_MIN);
    labFont(fs);
    w = kctx.measureText(txt).width;
  }
  /* Chữ rộng hơn phím thì phần chìa ra nằm trên phím BÊN CẠNH và mất nền tương phản
     (chữ trắng của phím đen tràn lên phím trắng là mất hút). Lót một viên nền ngược
     màu cho đúng mấy ca đó — cái giá phải trả của luật "luôn luôn hiện tên". */
  if (pad && w > room){
    kctx.fillStyle = pad;
    rrect(kctx, cx - w / 2 - 2, y - fs, w + 4, fs + 4, (fs + 4) / 2); kctx.fill();
  }
  kctx.fillStyle = color;
  kctx.fillText(txt, cx, y);
}

/* Mỗi tay 3 trạng thái: phát (nghe + nhìn) -> chỉ hiện (nhìn, tự đánh lấy) -> ẩn.
   "chỉ hiện" là chế độ tập từng tay: app im, nốt vẫn rơi và phím vẫn sáng dẫn đường. */
const handState = ['on', 'on'];
const HAND_NEXT  = { on:'silent', silent:'off', off:'on' };
const HAND_LABEL = { on:'phát', silent:'chỉ hiện', off:'ẩn' };

/* ==========================================================================
   3) AUDIO — Web Audio thuần, oscillator + ADSR
   ========================================================================== */
let actx = null, master = null, outGain = null, limiter = null, wetGain = null, clickGain = null;
/* Đếm vào + gõ nhịp: người mới không có mốc nào trong tai để canh lúc bấm.
   Mốc phách lấy từ `grid` (đã dựng từ time signature) nên không phải tính lại gì. */
let countIn = true, metro = true, clickIdx = 0;
let reverb = 0.35;                             /* nhớ cả khi AudioContext chưa được tạo */
let volume = 0.9;                              /* nhớ cả khi AudioContext chưa được tạo */

/* Hai bộ tiếng:
   - digital: oscillator + ADSR, 0 byte, luôn sẵn sàng (mặc định)
   - grand:   30 bản thu Salamander Grand Piano trong audio/piano/, cách nhau quãng 3 thứ
              (A0, C1, D#1, F#1, A1 … C8 => midi 21 + 3*i), nên mỗi nốt chỉ phải dịch
              tối đa 1 nửa cung — dịch xa hơn là méo tiếng ngay.
   Tải xong mới đổi; trong lúc chờ vẫn chơi bằng digital, không ai phải ngồi im. */
const SAMPLE_FILES = ['A0','C1','Ds1','Fs1','A1','C2','Ds2','Fs2','A2','C3','Ds3','Fs3',
                      'A3','C4','Ds4','Fs4','A4','C5','Ds5','Fs5','A5','C6','Ds6','Fs6',
                      'A6','C7','Ds7','Fs7','A7','C8'];
const SAMPLE_MIDI = i => 21 + 3 * i;                 /* A0 = 21, bước 3 nửa cung */
let tone = 'digital', piano = null, pianoLoading = false;
let currentSong = null;                        /* tên file trong thư viện, null nếu mở từ máy */
let voices = [], voiceCount = 0;
/* 16 là quá ít: bài dày như He's a Pirate (16 nốt/giây) giữ tới 16 voice cùng lúc
   suốt bài, làm rơi 15% số nốt — nghe như đánh sai giai điệu. Trình duyệt gánh
   được vài chục BufferSource thoải mái.
   Từ lúc áp pedal ngân thì đỉnh còn cao hơn: Für Elise 39, He's a Pirate 32.
   Golden Hour (2024 nốt, pedal đạp 140 lần, 55% phím đen) còn chạm hẳn trần 64 và
   phải cướp voice — nên nâng lên 96. Đừng hạ xuống. */
const MAX_VOICES = 96;

/* Đuôi vang tự dựng, không tải file IR nào: nhiễu trắng tắt dần theo hàm mũ, lọc
   thông thấp mạnh dần về cuối cho đuôi tối lại giống tiếng phòng thật. Hai kênh
   sinh riêng nên có bề ngang stereo. */
function makeReverbIR(sec, decay){
  const rate = actx.sampleRate, len = Math.max(1, Math.round(rate * sec));
  const ir = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++){
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++){
      const t = i / len;
      const n = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      lp += (n - lp) * (0.38 - 0.28 * t);
      d[i] = lp * 3.2;                         /* bù lại phần lọc thông thấp ăn mất */
    }
  }
  return ir;
}

function initAudio(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 1;      /* điểm gom mọi voice, để cố định */
  const comp = actx.createDynamicsCompressor();
  /* Nén nhẹ tay thôi: ngưỡng -18/tỉ lệ 6 là nén gần như toàn bộ tín hiệu, nghe bẹt và nhỏ.
     -10/4 chỉ chặn đỉnh của hợp âm dày, phần còn lại giữ nguyên độ động. */
  comp.threshold.value = -10; comp.ratio.value = 4;
  comp.attack.value = 0.004; comp.release.value = 0.15;
  /* Núm âm lượng phải nằm SAU compressor. Để trước thì kéo to bao nhiêu cũng bị
     compressor ăn lại gần hết — đó là lý do trước đây nghe mãi vẫn nhỏ. */
  /* Đường vang chạy song song, tách khỏi compressor để đuôi vang không bị nén bóp */
  const conv = actx.createConvolver();
  conv.buffer = makeReverbIR(2.4, 2.2);
  wetGain = actx.createGain(); wetGain.gain.value = reverb;
  master.connect(conv).connect(wetGain);

  outGain = actx.createGain(); outGain.gain.value = volume;
  wetGain.connect(outGain);

  /* Tiếng gõ đi thẳng vào outGain: không qua compressor (nó ngắn, bị nén thì mất
     tính dứt khoát) và không qua đường vang (gõ nhịp mà vang thì nhoè mất mốc). */
  clickGain = actx.createGain(); clickGain.gain.value = 0.55;
  clickGain.connect(outGain);
  /* Chốt chặn cuối: kéo to với hợp âm dày là vượt 1.0 và méo tiếng ngay (đã đo 1.18).
     Limiter đứng sau núm âm lượng để dù kéo hết cỡ cũng không bao giờ clip. */
  limiter = actx.createDynamicsCompressor();
  limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
  limiter.attack.value = 0.001; limiter.release.value = 0.08;
  /* Nhưng DynamicsCompressor KHÔNG phải brick-wall: attack 1ms nên đúng cái transient
     đầu của tiếng búa gõ dây lọt qua nguyên. Đo được ở bộ grand: 20 nốt cùng lúc
     vượt 1.0 ngay từ mức 150% (1.014), lên 200% là 1.066 — tức clip thật.
     Nên phải có tầng soft-clip cuối: dưới ngưỡng KNEE thì đi thẳng không đổi gì
     (nên không màu mè tiếng ở mức chơi bình thường), trên ngưỡng mới uốn mềm về 1.0
     và không bao giờ quá 1.0. Uốn mềm nghe khác hẳn clip vuông của hệ điều hành. */
  const KNEE = 0.85, N = 2049, curve = new Float32Array(N);
  for (let i = 0; i < N; i++){
    const x = i / (N - 1) * 2 - 1, a = Math.abs(x);
    curve[i] = a <= KNEE ? x
      : Math.sign(x) * (KNEE + (1 - KNEE) * Math.tanh((a - KNEE) / (1 - KNEE)));
  }
  const clip = actx.createWaveShaper();
  /* oversample phải để 'none'. Đã thử '2x' cho bớt aliasing: nó trễ hơn 8 mẫu và
     lọc cả tín hiệu — đo sóng sin biên độ 0.30 (cỡ đỉnh lúc chơi thường) thì lệch
     0.348 kể cả sau khi bù trễ. Với 'none' thì lệch ĐÚNG 0 dưới ngưỡng, tức khâu
     này không can thiệp gì ở mức chơi bình thường; aliasing thì không đáng lo vì
     đường uốn trơn và chỉ chạm tới ở mấy đỉnh transient ngắn. */
  clip.curve = curve; clip.oversample = 'none';
  master.connect(comp).connect(outGain).connect(limiter).connect(clip).connect(actx.destination);
}

function toneStatus(t){ $('toneV').textContent = t; }

async function loadPiano(){
  if (piano || pianoLoading) return;
  initAudio();
  pianoLoading = true;
  let done = 0;
  toneStatus('đang tải 0%');
  try {
    const bufs = await Promise.all(SAMPLE_FILES.map(async nm => {
      const r = await fetch('../audio/piano/' + nm + '.mp3');
      if (!r.ok) throw new Error(nm + '.mp3 — HTTP ' + r.status);
      const buf = trimMono(await actx.decodeAudioData(await r.arrayBuffer()));
      toneStatus('đang tải ' + Math.round(++done / SAMPLE_FILES.length * 100) + '%');
      return buf;
    }));
    piano = bufs.map((buf, i) => ({ midi: SAMPLE_MIDI(i), buf }));
    toneStatus(tone === 'grand' ? 'sẵn sàng' : '');
  } catch(err){
    toneStatus('lỗi tải tiếng');
    $('err').textContent = 'Không tải được tiếng grand piano: ' + err.message;
    $('tone').value = tone = 'digital';
  } finally { pianoLoading = false; }
}

/* Bản thu gốc dài tới 25 giây và stereo — giữ nguyên cả bộ là ~160 MB RAM, máy yếu chết.
   Nốt trong app dài nhất cũng chỉ vài giây rồi bị damper hãm, nên cắt còn 6 giây và
   trộn về mono: xuống dưới ~30 MB. Vuốt nhỏ 0.25s cuối để không "cụp" nếu nốt còn ngân. */
const SAMPLE_MAX_SEC = 6, SAMPLE_FADE = 0.25;
function trimMono(buf){
  const rate = buf.sampleRate;
  const frames = Math.min(buf.length, Math.round(SAMPLE_MAX_SEC * rate));
  const out = actx.createBuffer(1, frames, rate);
  const dst = out.getChannelData(0);
  const chans = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  for (let i = 0; i < frames; i++){
    let v = 0;
    for (const ch of chans) v += ch[i];
    dst[i] = v / chans.length;
  }
  if (frames === Math.round(SAMPLE_MAX_SEC * rate)){
    const fade = Math.round(SAMPLE_FADE * rate);
    for (let i = 0; i < fade; i++) dst[frames - fade + i] *= 1 - i / fade;
  }
  return out;
}

/* Bản thu gần nhất — lệch tối đa 1 nửa cung với nốt trong tầm 88 phím */
function nearestSample(midi){
  const i = Math.max(0, Math.min(SAMPLE_FILES.length - 1, Math.round((midi - 21) / 3)));
  return piano[i];
}

/* Gỡ một voice khỏi sổ đúng một lần, dù nó tự hết hay bị cướp */
function retire(rec){
  if (rec.dead) return;
  rec.dead = true;
  voiceCount--;
  const i = voices.indexOf(rec);
  if (i >= 0) voices.splice(i, 1);
}
/* Chạm trần thì CƯỚP voice cũ nhất, không bỏ nốt mới.
   Bỏ nốt mới đồng nghĩa với việc nuốt mất nốt giai điệu vừa tới. */
function stealOldest(){
  const v = voices[0];
  if (!v) return;
  const t = actx.currentTime;
  try {
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001, t, 0.008);
    for (const o of v.oscs) o.stop(t + 0.05);
  } catch(e){}
  retire(v);
}

function voice(n, when, dur){
  if (voiceCount >= MAX_VOICES) stealOldest();
  voiceCount++;
  if (tone === 'grand' && piano) return sampleVoice(n, when, dur);
  const f = 440 * Math.pow(2, (n.midi - 69) / 12);
  const g = actx.createGain();
  /* gain thấp, nốt càng cao càng nhỏ lại cho cân */
  const peak = 0.15 * (n.vel / 127) * Math.pow(0.5, Math.max(0, (n.midi - 84) / 24));
  const rel  = when + Math.max(dur, 0.06);
  g.gain.setValueAtTime(0.0001, when);                                    /* A */
  g.gain.linearRampToValueAtTime(peak, when + 0.006);
  g.gain.exponentialRampToValueAtTime(Math.max(peak*0.28, 0.0002),        /* D + S */
                                      when + Math.min(dur, 0.5));
  g.gain.setTargetAtTime(0.0001, rel, 0.10);                              /* R */
  g.connect(master);

  const oscs = [];
  for (const [type, semi, mix] of [['triangle',0,1], ['sine',12,0.35]]){
    const o = actx.createOscillator();
    o.type = type; o.frequency.value = f * Math.pow(2, semi/12);
    const og = actx.createGain(); og.gain.value = mix;
    o.connect(og).connect(g);
    o.start(when); o.stop(rel + 0.4);          /* release tau 0.10 -> sau 0.4s là im */
    oscs.push(o);
  }
  const rec = { g, oscs }; voices.push(rec);
  oscs[0].onended = () => retire(rec);
}

/* Nốt piano thu sẵn: chỉ cần chỉnh cao độ bằng playbackRate rồi cho damper hãm lại
   khi nhả phím. Không ADSR — attack/decay đã nằm trong bản thu. */
function sampleVoice(n, when, dur){
  const s = nearestSample(n.midi);
  const src = actx.createBufferSource();
  src.buffer = s.buf;
  src.playbackRate.value = Math.pow(2, (n.midi - s.midi) / 12);

  const g = actx.createGain();
  const peak = 0.9 * (0.35 + 0.65 * (n.vel / 127));    /* mẫu gốc đỉnh chỉ ~0.26 */
  const rel = when + Math.max(dur, 0.05);
  g.gain.setValueAtTime(peak, when);
  g.gain.setTargetAtTime(0.0001, rel, 0.09);     /* damper hãm dây, không cắt phựt */
  src.connect(g).connect(master);
  src.start(when);
  src.stop(rel + 0.45);                        /* damper tau 0.09 -> sau 0.45s là im */

  const rec = { g, oscs: [src] };
  voices.push(rec);
  src.onended = () => retire(rec);
}

function killVoices(){
  if (!actx) return;
  const t = actx.currentTime;
  for (const v of voices){
    try {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setTargetAtTime(0.0001, t, 0.015);
      for (const o of v.oscs) o.stop(t + 0.08);
    } catch(e){}
  }
}

/* ==========================================================================
   4) ĐỒNG HỒ — nguồn DUY NHẤT là audioCtx.currentTime
   ========================================================================== */
function songTime(){
  if (!playing || !actx) return seekOffset;
  return seekOffset + (actx.currentTime - startedAt) * rate;
}
function songToAudio(t){ return startedAt + (t - seekOffset) / rate; }
function anchorAt(t){ seekOffset = t; if (actx) startedAt = actx.currentTime; }

/* ==========================================================================
   5) LOAD
   ========================================================================== */
/* Trần thời gian một nốt được ngân: mẫu grand chỉ dài 6s (đã cắt), và tai người
   cũng không còn nghe thấy gì sau đó. Không có trần thì bài đạp pedal suốt như
   Endless Love sẽ giữ nốt tới vô hạn, ăn hết voice. */
const HOLD_MAX = 5;

/* File đời thật hay có 2 bộ track y hệt nhau (bắn ra 2 channel/2 thiết bị).
   Nạp cả hai thì nốt kêu đôi và hình bị chồng — nên so dấu vân tay từng track
   (cao độ + mốc bắt đầu làm tròn 1/8 giây) rồi bỏ track trùng.
   Tay chơi lấy theo TÊN track nếu file có khai; không thì mới đoán theo cao độ. */
function normalize(data){
  const names = data.trackNames || [];
  const byTrack = new Map();
  for (const n of data.notes){
    if (!byTrack.has(n.track)) byTrack.set(n.track, []);
    byTrack.get(n.track).push(n);
  }
  const ids = [...byTrack.keys()].sort((a,b) => a-b);
  const sig = new Map(ids.map(t =>
    [t, new Set(byTrack.get(t).map(n => n.midi + ':' + Math.round(n.start*8)))]));

  const drop = new Set();
  for (let i = 0; i < ids.length; i++){
    if (drop.has(ids[i])) continue;
    for (let j = i+1; j < ids.length; j++){
      if (drop.has(ids[j])) continue;
      const A = sig.get(ids[i]), B = sig.get(ids[j]);
      if (!A.size || !B.size) continue;
      let inter = 0; for (const k of B) if (A.has(k)) inter++;
      if (inter / Math.min(A.size, B.size) > 0.8) drop.add(ids[j]);
    }
  }

  const handOfTrack = t => {
    const nm = (names[t] || '').toLowerCase();
    if (/(^|[^a-z])(rh|right|treble|upper)([^a-z]|$)/.test(nm)) return 0;
    if (/(^|[^a-z])(lh|left|bass|lower)([^a-z]|$)/.test(nm)) return 1;
    return null;
  };
  const notes = data.notes.filter(n => !drop.has(n.track));
  const kept = [...new Set(notes.map(n => n.track))].sort((a,b) => a-b);
  const anyNamed = kept.some(t => handOfTrack(t) !== null);
  for (const n of notes){
    const h = handOfTrack(n.track);
    if (h !== null) n.hand = h;
    else if (anyNamed || kept.length === 1) n.hand = n.midi < 60 ? 1 : 0;   /* mốc C4 */
    else n.hand = n.track === kept[0] ? 0 : 1;
  }

  /* lưới còn sót nốt trùng gần đúng (lệch vài ms) thì bỏ nốt ngắn hơn */
  notes.sort((a,b) => a.midi - b.midi || a.start - b.start);
  const out = [];
  for (const n of notes){
    const q = out[out.length-1];
    if (q && q.midi === n.midi && Math.abs(q.start - n.start) < 0.03){
      if (n.end > q.end) out[out.length-1] = n;
      continue;
    }
    out.push(n);
  }
  /* Pedal ngân: nhả phím mà pedal còn đạp thì dây vẫn rung tới lúc nhả pedal.
     KHÔNG kéo dài `end` — `end` là lúc nhấc ngón, thân nốt rơi phải vẽ đúng thế,
     nếu kéo dài thì hoá ra dạy người ta giữ phím sai. Thời điểm tiếng tắt để
     riêng ở `hold`, chỉ engine audio dùng. */
  const pedal = data.pedal || [];
  const holdOf = end => {
    if (!pedal.length) return end;
    let down = false, i = 0;
    for (; i < pedal.length && pedal[i].sec <= end; i++) down = pedal[i].down;
    if (!down) return end;
    for (; i < pedal.length; i++) if (!pedal[i].down) return Math.max(end, pedal[i].sec);
    return end;                                /* pedal đạp tới hết bài */
  };
  for (const n of out) n.hold = Math.min(holdOf(n.end), n.start + HOLD_MAX);

  return { notes: out, grid: data.grid, pedal, dropped: data.notes.length - out.length };
}

function load(data, name){
  hideDone(); $('empty').classList.remove('on');
  data = normalize(data);
  notes = data.notes.slice().sort((a,b) => a.start - b.start);
  grid  = (data.grid || []).slice().sort((a,b) => a.sec - b.sec);
  bars = grid.filter(g => g.bar).map(g => g.sec);
  barIdx = -2; barKeys = null;

  duration = notes.reduce((m,n) => Math.max(m, n.end), 0) + 1;
  maxDur   = notes.reduce((m,n) => Math.max(m, n.end - n.start), 0);

  stop();
  resetLoop();                                 /* bài mới thì bỏ đoạn lặp của bài cũ */
  $('songname').textContent = name;
  $('err').textContent = '';
  computeRange(); resize();
}

/* "fit to range": chỉ vẽ khoảng cao độ bài dùng — bắt buộc cho màn hẹp */
function computeRange(){
  if ($('fit').checked && notes.length){
    let lo = 127, hi = 0;
    for (const n of notes){ if (n.midi < lo) lo = n.midi; if (n.midi > hi) hi = n.midi; }
    loMidi = Math.max(A0, lo - 2); hiMidi = Math.min(C8, hi + 2);
    while (isBlack(loMidi) && loMidi > A0) loMidi--;
    while (isBlack(hiMidi) && hiMidi < C8) hiMidi++;
  } else { loMidi = A0; hiMidi = C8; }
  buildGeom(); lastKeySig = null;
  layoutLoop();                                /* tay cầm đặt theo pixel nên phải dóng lại */
}

/* ==========================================================================
   6) GEOMETRY — precompute {x, w, black} cho từng phím, tách khỏi list nốt
   ========================================================================== */
function buildGeom(){
  let whites = 0;
  for (let m = loMidi; m <= hiMidi; m++) if (!isBlack(m)) whites++;
  const ww = W / Math.max(whites, 1), bw = ww * 0.62;
  const g = {}; let wi = 0;
  for (let m = loMidi; m <= hiMidi; m++){
    if (isBlack(m)) g[m] = { x: wi*ww - bw/2, w: bw, black:true };
    else { g[m] = { x: wi*ww, w: ww, black:false }; wi++; }
  }
  geom = g;
  buildOct();
}

/* Dải quãng tám — mốc để mắt biết đang ở CAO ĐỘ nào. Chỉ phụ thuộc geometry nên
   dựng một lần cùng bảng phím, không tính lại mỗi frame.
   Mốc lấy theo phím TRẮNG: mép phải phím Si chính là mép trái phím Đô kế tiếp, nên
   dải khít nhau và tự bị kẹp lại ở hai đầu khi đang thu gọn phím. Phím đen thì chìa
   ra nửa bề ngang qua mốc, lấy theo nó là dải bị lệch. */
function buildOct(){
  const b = new Map();
  for (let m = loMidi; m <= hiMidi; m++){
    if (isBlack(m)) continue;
    const o = Math.floor(m / 12) - 1, g = geom[m];
    const cur = b.get(o) || { oct:o, x0:Infinity, x1:-Infinity };
    cur.x0 = Math.min(cur.x0, g.x); cur.x1 = Math.max(cur.x1, g.x + g.w);
    b.set(o, cur);
  }
  octBands = [...b.values()];
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = fall.clientWidth; HF = fall.clientHeight; HK = keys.clientHeight;
  for (const [c, ctx, h] of [[fall, fctx, HF], [keys, kctx, HK]]){
    c.width = Math.round(W * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  buildGeom(); lastKeySig = null;
}
new ResizeObserver(resize).observe($('stage'));

/* ==========================================================================
   7) VẼ
   ========================================================================== */
/* --------------------------------------------------------------------------
   Tập phím cần bấm trong Ô NHỊP đang chơi. Phím ngoài tập này bị phủ xám, để
   mắt chỉ còn phải quét một vùng hẹp và tay chuẩn bị được trước cả ô nhịp.
   Nốt đang vang và nốt trong tầm gợi ý (1.2s) KHÔNG bị phủ — nếu phủ thì sẽ
   đá nhau với phím đang sáng, và cũng chính nhờ vậy mà phím của ô nhịp kế
   tiếp mở ra sớm ~1.2s, đúng lúc cần chuẩn bị.
   -------------------------------------------------------------------------- */
let bars = [], barIdx = -2, barKeys = null;

function barAt(t){                             /* chỉ số vạch ô nhịp cuối cùng <= t */
  let lo = 0, hi = bars.length;
  while (lo < hi){ const m = (lo + hi) >> 1; if (bars[m] <= t) lo = m + 1; else hi = m; }
  return lo - 1;
}

function barScope(now){
  if (!bars.length || !notes.length) return null;
  const i = barAt(now);
  if (i === barIdx) return barKeys;            /* chỉ tính lại khi sang ô nhịp mới */
  const s = i < 0 ? 0 : bars[i];
  const e = i + 1 < bars.length ? bars[i + 1] : Infinity;
  const set = new Set();
  for (let j = lowerBound(s); j < notes.length; j++){
    const n = notes[j];
    if (n.start >= e) break;
    if (handState[n.hand] === 'off') continue;
    set.add(n.midi);
  }
  barIdx = i; barKeys = set;
  return set;
}

function lowerBound(t){                       /* binary search theo start */
  let lo = 0, hi = notes.length;
  while (lo < hi){ const m = (lo+hi) >> 1; if (notes[m].start < t) lo = m+1; else hi = m; }
  return lo;
}
function gridLB(t){
  let lo = 0, hi = grid.length;
  while (lo < hi){ const m = (lo+hi) >> 1; if (grid[m].sec < t) lo = m+1; else hi = m; }
  return lo;
}
function rrect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
         ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
}

/* #rgb / #rrggbb -> rgba(). Cần cho gradient: globalAlpha là một con số cho cả hình,
   không đổi được theo chiều dọc, nên độ mờ phải nằm ngay trong chính mốc màu. */
function hexA(h, a){
  if (h.length === 4) h = '#' + h[1]+h[1] + h[2]+h[2] + h[3]+h[3];
  return 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ','
       + parseInt(h.slice(5,7),16) + ',' + a + ')';
}
/* Gradient dọc dùng lại được: tập gradient của app chỉ vài cái (2 màu tay x 2 khung),
   mà tạo gradient là thao tác đắt — đừng dựng lại cho từng vệt mỗi frame. Khoá cache
   gồm cả y0/y1 nên đổi khung hay đổi tầm nhìn là tự có cái mới. */
const gradCache = new Map();
function vgrad(ctx, y0, y1, col, stops){
  const key = (ctx === fctx ? 'f' : 'k') + y0 + ',' + y1 + ',' + col + ',' + stops.id;
  let g = gradCache.get(key);
  if (!g){
    if (gradCache.size > 24) gradCache.clear();   /* kéo đổi khung liên tục thì y0/y1
                                                     đổi từng frame, đừng giữ lại hết */
    g = ctx.createLinearGradient(0, y0, 0, y1);
    for (const [off, a] of stops) g.addColorStop(off, hexA(col, a));
    gradCache.set(key, g);
  }
  return g;
}
/* Vệt dẫn: mờ hẳn ở trên, bừng lên ở sát vạch chạm. Trên thân phím thì ngược lại —
   đậm ở mép trên (chỗ nối với vạch chạm) rồi nhạt dần xuống, để hai bên khớp nhau. */
const TRAIL_STOPS = Object.assign([[0, .03], [0.62, .14], [1, .55]], { id: 'fall' });
const KEY_STOPS   = Object.assign([[0, 0.60], [0.75, 0.06], [1, 0]], { id: 'key' });

function spawnHit(midi, hand){
  const g = geom[midi]; if (!g) return;
  const cx = g.x + g.w / 2;
  flashes.push({ x: cx, w: g.w, hand, life: 0, max: 0.3 });
  const n = g.black ? 8 : 12;
  for (let i = 0; i < n && parts.length < MAX_PARTS; i++){
    const a = -Math.PI/2 + (Math.random() - 0.5) * 1.7;     /* toè lên trên */
    const sp = 110 + Math.random() * 230;
    parts.push({
      x: cx + (Math.random() - 0.5) * g.w * 0.6, y: HF - 2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 1.8 + Math.random() * 2.4, hand, life: 0, max: 0.4 + Math.random() * 0.45
    });
  }
}

function drawFx(dt){
  if (!parts.length && !flashes.length) return;
  /* vệt loé ở vạch chạm: 2 vòng mờ lồng nhau, KHÔNG shadowBlur */
  for (let i = flashes.length - 1; i >= 0; i--){
    const f = flashes[i];
    f.life += dt;
    if (f.life >= f.max){ flashes.splice(i, 1); continue; }
    const p = f.life / f.max, col = handCol(f.hand), fade = 1 - p;
    /* cột sáng vọt lên từ phím: 4 khối xếp cao dần, mờ dần — thay cho gradient
       (tạo gradient cho từng cú chạm mỗi frame thì quá đắt) */
    fctx.fillStyle = col;
    for (let k = 0; k < 4; k++){
      fctx.globalAlpha = fade * (0.30 - k * 0.06);
      const h = (10 + k * 13) * (0.5 + p);
      const w = f.w * (0.85 - k * 0.12);
      fctx.fillRect(f.x - w / 2, HF - h, w, h);
    }
    /* loé trắng ngay tại vạch chạm cho có điểm nhấn */
    const rw = f.w * (1.0 + p * 1.5), rh = 7 + p * 18;
    fctx.globalAlpha = fade * 0.75;
    fctx.fillStyle = '#fff';
    fctx.beginPath(); fctx.ellipse(f.x, HF - 1, rw / 3, rh / 3, 0, 0, Math.PI * 2); fctx.fill();
    fctx.globalAlpha = fade * 0.5;
    fctx.fillStyle = col;
    fctx.beginPath(); fctx.ellipse(f.x, HF - 1, rw / 2, rh / 2, 0, 0, Math.PI * 2); fctx.fill();
    fctx.globalAlpha = fade * 0.25;
    fctx.beginPath(); fctx.ellipse(f.x, HF - 1, rw, rh, 0, 0, Math.PI * 2); fctx.fill();
  }
  /* hạt: gom theo tay + 4 nấc độ mờ để chỉ tốn vài lệnh fill */
  const buckets = new Map();
  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i];
    q.life += dt;
    if (q.life >= q.max || q.y > HF + 6){ parts.splice(i, 1); continue; }
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vy += 300 * dt;                                       /* trọng lực nhẹ */
    const a = Math.max(0, 1 - q.life / q.max);
    const k = q.hand + ':' + Math.ceil(a * 4);
    let arr = buckets.get(k); if (!arr){ arr = []; buckets.set(k, arr); }
    arr.push(q);
  }
  for (const [k, arr] of buckets){
    const [hand, step] = k.split(':');
    fctx.globalAlpha = (+step / 4) * 0.95;
    fctx.fillStyle = handCol(+hand);
    fctx.beginPath();
    for (const q of arr){
      const a = Math.max(0, 1 - q.life / q.max);
      fctx.moveTo(q.x + q.r * a, q.y);
      fctx.arc(q.x, q.y, Math.max(q.r * a, 0.4), 0, Math.PI * 2);
    }
    fctx.fill();
  }
  fctx.globalAlpha = 1;
}

function drawFalling(now, dt){
  fctx.clearRect(0, 0, W, HF);
  const PPS = HF / lookahead;                 /* pixel mỗi giây */
  const y = t => HF - (t - now) * PPS;        /* t == now  ->  chạm bàn phím */
  const winEnd = now + lookahead;

  /* Dải quãng tám đan xen chẵn/lẻ, kèm số quãng tám in chìm giữa dải. Cần vì ở chế
     độ số theo C thì mọi C đều là "1" — nhãn trên nốt cho biết BẬC, còn dải này mới
     cho biết bậc đó nằm ở CAO ĐỘ nào. Sắc chênh cố ý rất nhẹ: chỉ để phân biệt hai
     dải cạnh nhau, không phải để trang trí, nốt rơi vẫn phải là thứ nổi nhất màn. */
  for (const b of octBands)
    if (b.oct % 2 === 0){
      fctx.fillStyle = 'rgba(214,228,255,.030)';
      fctx.fillRect(b.x0, 0, b.x1 - b.x0, HF);
    }
  fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
  for (const b of octBands){
    /* cỡ chữ co theo cả bề ngang dải LẪN chiều cao vùng rơi; dải cụt ở hai đầu bàn
       phím (A0–B0, C8) hẹp quá thì bỏ, in ra chỉ thành vệt bẩn */
    const fs = Math.min((b.x1 - b.x0) * 0.62, HF * 0.55);
    if (fs < 15) continue;
    fctx.font = '800 ' + Math.round(fs) + 'px system-ui,-apple-system,sans-serif';
    fctx.fillStyle = 'rgba(196,212,238,.072)';
    fctx.fillText(b.oct, (b.x0 + b.x1) / 2, HF / 2);
  }

  /* lưới quãng tám (dọc) */
  fctx.strokeStyle = 'rgba(120,132,154,.13)'; fctx.lineWidth = 1;
  fctx.beginPath();
  for (let m = loMidi; m <= hiMidi; m++)
    if (m % 12 === 0 && geom[m]){ const x = Math.round(geom[m].x) + .5; fctx.moveTo(x,0); fctx.lineTo(x,HF); }
  fctx.stroke();

  /* lưới phách / ô nhịp (ngang) */
  if (grid.length){
    fctx.textAlign = 'left'; fctx.textBaseline = 'bottom';
    fctx.font = '500 10px system-ui,-apple-system,sans-serif';
    for (let i = Math.max(gridLB(now) - 1, 0); i < grid.length; i++){
      const g = grid[i];
      if (g.sec > winEnd) break;
      const gy = Math.round(y(g.sec)) + .5;
      if (gy < -1 || gy > HF) continue;
      fctx.strokeStyle = g.bar ? 'rgba(160,175,200,.28)' : 'rgba(120,132,154,.10)';
      fctx.lineWidth = g.bar ? 1.2 : 1;
      fctx.beginPath(); fctx.moveTo(0, gy); fctx.lineTo(W, gy); fctx.stroke();
      if (g.bar && g.num % 2 === 1){
        fctx.fillStyle = 'rgba(160,175,200,.40)';
        fctx.fillText(g.num, 4, gy - 2);
      }
    }
  }

  /* culling: lùi window lại maxDur để nốt bass dài không biến mất */
  const from = lowerBound(now - maxDur);
  const active = [], visible = [], hints = new Map(), trails = new Map();
  for (let i = from; i < notes.length; i++){
    const n = notes[i];
    if (n.start > winEnd) break;
    if (n.end < now) continue;
    if (handState[n.hand] === 'off') continue;
    const g = geom[n.midi]; if (!g) continue;
    if (n.start <= now) active.push(n);        /* 'chỉ hiện' vẫn làm sáng phím để dẫn tay */
    else if (hintOn()){
      /* Vệt dẫn bám nốt GẦN PHÍM NHẤT của mỗi phím và KHÔNG có cửa sổ thời gian:
         nốt vừa hiện ra ở mép trên là đã có cột dẫn xuống đúng phím của nó, mắt đi
         theo được từ đầu. Gắn nó vào HINT_LEAD như trước thì cột chỉ bật lên khi
         còn 1.2s — sát quá, tới lúc thấy thì tay đã không kịp dóng.
         `notes` sort theo start nên cái gặp trước chính là cái gần phím nhất. */
      if (!trails.has(n.midi)) trails.set(n.midi, { start: n.start, hand: n.hand });
      /* Phím trên bàn phím thì VẪN chỉ sáng trong HINT_LEAD — sáng sớm hơn là cả
         bàn phím lúc nào cũng sáng, mất luôn nghĩa "sắp phải bấm". */
      if (n.start <= now + HINT_LEAD){
        const p = 1 - (n.start - now) / HINT_LEAD;      /* 0 = còn xa, 1 = sắp phải bấm */
        const cur = hints.get(n.midi);
        if (!cur || p > cur.p) hints.set(n.midi, { p, hand: n.hand });
      }
    }
    visible.push([n, g]);
  }

  /* Vệt dẫn nối đáy nốt gần nhất với đúng phím của nó — mắt khỏi phải dóng theo cột.
     Là một KHỐI CHỮ NHẬT LIỀN rộng đúng bằng thân nốt, mờ dần lên trên. Bản cũ là
     đường nét đứt 1px: trên iPad/điện thoại mảnh quá, gần như không thấy, mà nét đứt
     còn cắt vụn cái cột lẽ ra phải liền mạch.
     Gradient trải đúng CẢ vùng rơi và neo ở vạch chạm, nên độ mờ chỉ là hàm của y —
     MỌI vệt dùng chung một đối tượng bất kể đáy nốt đang ở đâu.
     Vẽ TRƯỚC thân nốt: vệt chạy từ đáy nốt xuống tận vạch chạm nên nó cắt ngang thân
     nốt đang vang của chính phím đó; vẽ sau là phủ một lớp mờ lên nốt đặc. */
  if (hintOn() && trails.size){
    fctx.save();
    fctx.beginPath(); fctx.rect(0, 0, W, HF); fctx.clip();
    for (const [m, t] of trails){
      const g = geom[m]; if (!g) continue;
      const yTop = y(t.start);
      const q = Math.max(yTop / HF, 0);        /* 0 = vừa ló ở mép trên, 1 = chạm phím */
      fctx.globalAlpha = 0.20 + 0.80 * q * q;
      fctx.fillStyle = vgrad(fctx, 0, HF, handCol(t.hand), TRAIL_STOPS);
      fctx.fillRect(g.x + 1, yTop, g.w - 2, HF - yTop);
    }
    fctx.restore();
  }

  fctx.save(); fctx.beginPath(); fctx.rect(0, 0, W, HF); fctx.clip();
  /* phím trắng trước, phím đen sau (đè lên trên) */
  for (const black of [false, true]){
    for (const [n, g] of visible){
      if (g.black !== black) continue;
      const top = y(n.end), h = Math.max((n.end - n.start) * PPS, 3);
      if (top > HF) continue;
      const live = n.start <= now && n.end >= now;
      const col  = handCol(n.hand);
      const silent = handState[n.hand] === 'silent';

      if (live && !silent){                   /* glow: lớp mờ phía sau, KHÔNG shadowBlur */
        fctx.globalAlpha = 0.28; fctx.fillStyle = col;
        rrect(fctx, g.x - 2, top - 2, g.w + 4, h + 4, 5); fctx.fill();
      }
      fctx.globalAlpha = silent ? 0.4 : 1;
      fctx.fillStyle = col;
      rrect(fctx, g.x + 1, top, g.w - 2, h, 3); fctx.fill();

      fctx.globalAlpha = silent ? 0.2 : (live ? 0.55 : 0.3);   /* vệt sáng bên trái */
      fctx.fillStyle = '#fff';
      rrect(fctx, g.x + 1, top, Math.max(g.w * 0.22, 2), h, 3); fctx.fill();
      fctx.globalAlpha = 1;
    }

    /* CHẾ ĐỘ SỐ: in số phím lên GIỮA thân nốt. Đây là thứ chính phải đọc ở chế độ
       này nên nó được chỗ giữa.
       Không mâu thuẫn với quyết định cũ "đã thử in TÊN NỐT lên thân nốt rồi bỏ":
       tên nốt dài 2–4 chữ và chỉ cho biết "nốt gì", còn số ở đây 1–2 chữ và ứng
       đúng một phím — tức trả lời được "bấm phím NÀO", chính là câu người tập cần. */
    if (numMode()){
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      for (const fs of NUM_SIZES){
        let set = false;
        for (const [n, g] of visible){
          if (g.black !== black) continue;
          const top = y(n.end), h = Math.max((n.end - n.start) * PPS, 3);
          if (top > HF) continue;
          const txt = numText(n.midi);
          /* số hai chữ cần chỗ ngang gấp ~1.75 lần số một chữ, không chia thì "88"
             chọn nấc font quá to rồi chìa ra ngoài thân nốt */
          if (numSize(txt.length > 1 ? g.w / 1.75 : g.w, h) !== fs) continue;
          const cy = top + h / 2;
          if (cy < fs * 0.6 || cy > HF - 2) continue;
          if (!set){ fctx.font = '800 ' + fs + 'px system-ui,-apple-system,sans-serif'; set = true; }
          fctx.fillStyle = handState[n.hand] === 'silent' ? '#c9d6ea' : '#0d1118';
          fctx.fillText(txt, g.x + g.w / 2, cy);
        }
      }
    }
  }
  fctx.restore();

  /* Đang đếm vào (songTime âm): in số phách còn lại thật to, bé nhìn là biết
     "còn mấy nhịp nữa tới lượt mình". */
  if (now < 0){
    const b = beatAt(0), left = Math.max(1, Math.ceil(-now / b));
    fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
    fctx.font = '700 ' + Math.round(Math.min(HF * 0.42, W * 0.18)) + 'px system-ui,-apple-system,sans-serif';
    fctx.globalAlpha = 0.13 + 0.5 * (1 - (-now % b) / b);
    fctx.fillStyle = css('--rh');
    fctx.fillText(left, W / 2, HF * 0.45);
    fctx.globalAlpha = 1;
  }

  fctx.fillStyle = 'rgba(211,218,230,.22)'; fctx.fillRect(0, HF - 2, W, 2);   /* vạch chạm */

  /* nốt nào vừa chạm phím trong frame này thì bắn hạt — so với frame trước */
  if (showFx){
    const on = new Set();
    for (const n of active) on.add(n.midi);
    /* Sau khi tua, cả nắm nốt đang vang đều "mới" — bắn hạt cho hết thì loé
       cả màn. Bỏ qua đúng một frame để nạp lại prevOn. */
    if (playing && !fxSkip) for (const n of active) if (!prevOn.has(n.midi)) spawnHit(n.midi, n.hand);
    fxSkip = false;
    prevOn = on;
    drawFx(Math.min(dt || 0, 0.05));                /* chặn dt to sau lúc tab bị treo */
  } else if (parts.length || flashes.length){
    parts = []; flashes = [];
  }
  return { active, hints, now };
}

function drawKeys(state){
  const { active, hints, now } = state;
  const scope = showScope ? barScope(now) : null;
  const on = new Map();
  for (const n of active) on.set(n.midi, handCol(n.hand));

  /* Chữ ký gồm cả độ sáng gợi ý (làm tròn 8 nấc) — nhờ vậy vẫn tránh vẽ lại
     mỗi frame, mà nhìn thì vẫn thấy phím sáng dần lên mượt. */
  let sig = [...on.keys()].sort((a,b) => a-b).join(',');
  if (hints.size){
    const h = [];
    for (const [m, v] of hints) h.push(m + ':' + Math.round(v.p * 8) + ':' + v.hand);
    sig += '|' + h.sort().join(',');
  }
  if (scope) sig += '|b' + barIdx;             /* sang ô nhịp mới thì phải vẽ lại */
  if (sig === lastKeySig) return;
  lastKeySig = sig;

  const lit = new Set([...on.keys(), ...hints.keys()]);
  kctx.clearRect(0, 0, W, HK);
  const ivory = css('--ivory'), ebony = css('--ebony');
  const shade = kctx.createLinearGradient(0, HK*0.75, 0, HK);   /* dựng 1 lần, dùng cho mọi phím */
  shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,.18)');
  kctx.textAlign = 'center'; kctx.textBaseline = 'alphabetic';

  /* Tô KÍN cả phím, chỉ đậm dần lên theo p. Từng thử kiểu vệt màu dâng dần từ trên
     xuống như đếm ngược — nhìn rối hơn hẳn, bỏ. Một tín hiệu duy nhất là đủ.
     Bình phương nên lúc còn xa chỉ nhen nhẹ, tới sát mới bừng; trần vẫn nhạt hơn
     phím đang kêu để không lẫn "sắp bấm" với "đang kêu". */
  const hintAlpha = p => 0.10 + 0.42 * p * p;

  /* Phím trắng thì phủ tối đi, phím đen thì nhấc sáng lên một chút — cùng dồn về
     phía xám nhưng vẫn giữ trắng sáng hơn đen, nếu không thì mất luôn hình dạng
     bàn phím và người ta không dóng được phím nào ra phím nào. */
  const dim = m => scope && !scope.has(m) && !on.has(m) && !hints.has(m);

  for (let m = loMidi; m <= hiMidi; m++){
    const g = geom[m]; if (!g || g.black) continue;
    kctx.fillStyle = on.has(m) ? on.get(m) : ivory;
    kctx.fillRect(g.x, 0, g.w - 1, HK);
    if (!on.has(m)){
      kctx.fillStyle = shade; kctx.fillRect(g.x, 0, g.w - 1, HK);
      const hint = hints.get(m);
      if (hint){
        kctx.globalAlpha = hintAlpha(hint.p);
        kctx.fillStyle = handCol(hint.hand);
        kctx.fillRect(g.x, 0, g.w - 1, HK);
        /* Vệt dẫn chạy tiếp xuống thân phím: đậm ở mép trên đúng chỗ nối với vạch
           chạm rồi nhạt dần, nên cột nốt rơi và phím thành MỘT khối liền trong mắt.
           Vẽ ở đây chứ không phải cuối hàm, để nhãn tên nốt in đè lên trên chứ
           không bị lớp mờ này phủ xuống. */
        kctx.globalAlpha = 0.35 + 0.5 * hint.p;
        kctx.fillStyle = vgrad(kctx, 0, HK, handCol(hint.hand), KEY_STOPS);
        kctx.fillRect(g.x, 0, g.w - 1, HK);
        kctx.globalAlpha = 1;
      }
    }
    if (dim(m)){ kctx.fillStyle = 'rgba(74,84,102,.62)'; kctx.fillRect(g.x, 0, g.w - 1, HK); }
    const cx = g.x + (g.w - 1) / 2, by = HK - Math.max(HK * 0.07, 5);
    /* Chế độ số thì in số lên MỌI phím, không chỉ phím đang sáng: cả bàn phím trở
       thành cái thước để mắt dóng vào. Làm được vì số chỉ 1–2 chữ, chứ nhãn tên nốt
       ("Sol#") in hết 88 phím thì thành rừng chữ — đó là lý do chế độ note vẫn chỉ
       in ở phím đang kêu / sắp bấm. Viên thuốc đậm ở Đô giữa thì giữ nguyên cho cả
       ba chế độ: ở deg mọi C đều là "1" nên đó là thứ duy nhất còn neo được mắt. */
    if (numMode()){
      if (m === 60) keyBadge(numText(m), cx, by, g.w - 3);
      else keyLabel(numText(m), cx, by, g.w - 3, 12, '#1b202b');
    }
    else if (m === 60)
      keyBadge(octName(m), cx, by, g.w - 3);   /* Đô giữa */
    else if (m % 12 === 0)
      keyLabel(octName(m), cx, by, g.w - 3, 11, '#1b202b');
    else if (lit.has(m))
      keyLabel(keyName(m), cx, by, g.w - 3, 12, '#1b202b');
  }
  const bh = HK * 0.62;
  for (let m = loMidi; m <= hiMidi; m++){
    const g = geom[m]; if (!g || !g.black) continue;
    kctx.fillStyle = on.has(m) ? on.get(m) : ebony;
    kctx.fillRect(g.x, 0, g.w, bh);
    if (!on.has(m)){
      kctx.fillStyle = 'rgba(255,255,255,.07)'; kctx.fillRect(g.x, 0, g.w, bh*0.18);
      const hint = hints.get(m);
      if (hint){
        kctx.globalAlpha = hintAlpha(hint.p);
        kctx.fillStyle = handCol(hint.hand);
        kctx.fillRect(g.x, 0, g.w, bh);
        kctx.globalAlpha = 0.45 + 0.5 * hint.p;    /* phím đen tối hơn nên cần đậm hơn */
        kctx.fillStyle = vgrad(kctx, 0, bh, handCol(hint.hand), KEY_STOPS);
        kctx.fillRect(g.x, 0, g.w, bh);
        kctx.globalAlpha = 1;
      }
    }
    if (dim(m)){ kctx.fillStyle = 'rgba(150,163,186,.30)'; kctx.fillRect(g.x, 0, g.w, bh); }
    /* Phím đen hẹp hơn phím trắng nên nhãn hay chìa ra ngoài — truyền nền lót
       tối để phần chìa lên phím trắng vẫn đọc được. */
    if (numMode())
      keyLabel(numText(m), g.x + g.w / 2, bh - Math.max(bh * 0.08, 3), g.w - 2, 10, '#fff', '#1b202b');
    else if (lit.has(m))
      keyLabel(keyName(m), g.x + g.w / 2, bh - Math.max(bh * 0.08, 3), g.w - 2, 10, '#fff', '#1b202b');
  }
  kctx.fillStyle = 'rgba(0,0,0,.5)'; kctx.fillRect(0, 0, W, 2);
}

/* ==========================================================================
   8) HAI ĐỒNG HỒ — rAF chỉ vẽ; timer 25ms lo lên lịch phát trước ~100ms
   ========================================================================== */
/* Lên lịch trước 0.5s thay vì 0.1s. Lý do: nốt nào timer tới trễ hơn độ dài của nó
   thì bị `n.end < now` vứt bỏ VĨNH VIỄN (schedIdx đã đi qua) — bài dày nốt chỉ 0.15s
   nên chỉ cần khựng > 250ms là mất nốt, nghe như đánh sai. Đo mô phỏng: khựng 200ms
   rải rác thì 0.1s vẫn rơi 0%, nhưng biên an toàn quá mỏng. 0.5s nuốt được mọi cú
   khựng thực tế mà đổi tốc độ / tắt tay vẫn nhạy vì các đường đó đều killVoices() +
   tính lại schedIdx. */
const AHEAD = 0.5;
/* Thân scheduler tách thành hàm có tên để gọi được mà kiểm, thay vì đóng kín
   trong callback của setInterval. */
function schedule(){
  if (!playing || !actx) return;
  const now = songTime(), until = now + AHEAD * rate;
  while (schedIdx < notes.length && notes[schedIdx].start < until){
    const n = notes[schedIdx++];
    if (n.end < now || handState[n.hand] !== 'on') continue;
    voice(n, Math.max(songToAudio(n.start), actx.currentTime), ((n.hold || n.end) - n.start) / rate);
  }
  if (metro){
    while (clickIdx < grid.length && grid[clickIdx].sec < until){
      const bt = grid[clickIdx++];
      if (bt.sec < now - 0.08) continue;       /* phách đã qua thì bỏ, đừng gõ dồn */
      click(Math.max(songToAudio(bt.sec), actx.currentTime), bt.bar);
    }
  }

  /* Đang lặp thì quay về đầu đoạn. Neo lại TẠI CHỖ chứ không gọi seekTo(): seekTo
     đi qua play() nên mỗi vòng lặp lại đếm vào một lần, chen im lặng vào giữa câu. */
  if (loopOn() && now >= loopB){
    killVoices(); fxSkip = true; parts = []; flashes = [];
    anchorAt(loopA);
    schedIdx = lowerBound(loopA); clickIdx = gridLB(loopA);
    lastKeySig = null;
    return;
  }
  if (now >= duration){ stop(); savePrefs({ pos: 0 }); showDone(); }   /* hết bài: lần sau mở lại từ đầu */
}
setInterval(schedule, 25);

function showDone(){
  $('doneName').textContent = $('songname').textContent;
  $('done').classList.add('on');
}
function hideDone(){ $('done').classList.remove('on'); }

/* --------------------------------------------------------------------------
   Đoạn lặp. Kéo hai tay cầm ở hai đầu thanh tua để chọn đoạn, hệ thống chơi
   lặp trong đoạn đó thay vì hết bài là xong — đúng cách người ta tập một câu
   khó: cày đúng câu đó vài chục lần.
   Mặc định A = 0, B = hết bài, tức KHÔNG lặp (`loopOn()` đòi đoạn hẹp hơn cả
   bài và dài ít nhất LOOP_MIN giây).
   -------------------------------------------------------------------------- */
function resetLoop(){ loopA = 0; loopB = duration; layoutLoop(); }

/* Đổi đoạn lặp. Giữ A <= B - LOOP_MIN, và nếu đang chơi ngoài đoạn thì nhảy vào. */
function setLoop(a, b, jump){
  const lim = Math.max(duration, LOOP_MIN);
  loopA = Math.min(Math.max(a, 0), lim - LOOP_MIN);
  loopB = Math.min(Math.max(b, loopA + LOOP_MIN), lim);
  layoutLoop();
  if (jump && loopOn()){
    const t = songTime();
    if (t < loopA || t > loopB) seekTo(loopA);
  }
  savePrefs({ la: loopOn() ? loopA : 0, lb: loopOn() ? loopB : 0 });
}

/* Vị trí pixel trên thanh tua. Dùng đúng khoảng lề của nút tròn native (nửa
   bề rộng nút = 7.5px) để tay cầm và nút tròn dóng thẳng với nhau. */
const SEEK_PAD = 7.5;
function seekX(t){
  const w = $('seekwrap').clientWidth;
  const f = duration ? Math.min(Math.max(t / duration, 0), 1) : 0;
  return SEEK_PAD + f * (w - 2 * SEEK_PAD);
}
function seekT(clientX){
  const r = $('seekwrap').getBoundingClientRect();
  const f = (clientX - r.left - SEEK_PAD) / Math.max(r.width - 2 * SEEK_PAD, 1);
  return Math.min(Math.max(f, 0), 1) * duration;
}
function layoutLoop(){
  const xa = seekX(loopA), xb = seekX(loopB), on = loopOn();
  /* Kẹp vào trong khung: không kẹp thì tay cầm bên phải chìa ra 4px và làm cả
     trang tràn ngang (đo được scrollWidth 847 trên khung 844), tức trên điện
     thoại là vuốt ngang được cả trang. Lệch tối đa 3.5px, mắt không thấy. */
  const wrapW = $('seekwrap').clientWidth;
  const clamp = x => Math.min(Math.max(x - 11, 0), Math.max(wrapW - 22, 0));
  $('lga').style.left = clamp(xa) + 'px';
  $('lgb').style.left = clamp(xb) + 'px';
  $('lga').classList.toggle('on', on);
  $('lgb').classList.toggle('on', on);
  const band = $('loopband');
  band.style.display = on ? 'block' : 'none';
  band.style.left = xa + 'px';
  band.style.width = Math.max(xb - xa, 0) + 'px';
  const chip = $('loopchip');
  chip.hidden = !on;
  if (on) chip.textContent = 'Lặp ' + fmt(loopA) + '–' + fmt(loopB) + ' ✕';
}

/* Kéo tay cầm. Không dùng nút native thứ hai vì <input type=range> chỉ có một
   nút; hai div riêng lại tiện cho vùng bấm to hơn ngón tay. */
for (const [id, which] of [['lga', 0], ['lgb', 1]]){
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const move = ev => {
      const t = seekT(ev.clientX);
      if (which === 0) setLoop(t, Math.max(loopB, t + LOOP_MIN), false);
      else             setLoop(Math.min(loopA, t - LOOP_MIN), t, false);
    };
    const up = ev => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      setLoop(loopA, loopB, true);             /* đang chơi ngoài đoạn thì nhảy vào */
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}
$('loopchip').onclick = () => { resetLoop(); savePrefs({ la: 0, lb: 0 }); };

let dragging = false;
const PP_PLAY  = 'M3.5 2.2 13 8l-9.5 5.8z';
const PP_PAUSE = 'M4 2.5h3v11H4zM9 2.5h3v11H9z';
function syncPlayBtn(){
  $('ppIcon').setAttribute('d', playing ? PP_PAUSE : PP_PLAY);
  const t = playing ? 'Tạm dừng' : 'Chơi';
  $('play').title = t + ' (Space)';
  $('play').setAttribute('aria-label', t);
}
const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ':' + String(s % 60).padStart(2, '0'); };

let lastTs = 0;
function frame(ts){
  const dt = lastTs ? (ts - lastTs) / 1000 : 0;
  lastTs = ts;
  const now = songTime();
  drawKeys(drawFalling(now, dt));
  if (!dragging){
    const shown = Math.max(0, Math.min(now, duration));
    const pct = duration ? shown / duration * 100 : 0;
    $('seek').value = (pct * 10) | 0;
    $('seek').style.setProperty('--p', pct.toFixed(2) + '%');
    $('time').textContent = fmt(shown) + ' / ' + fmt(duration);
  }
  requestAnimationFrame(frame);
}

/* ==========================================================================
   9) TRANSPORT
   ========================================================================== */
function play(){
  if (!notes.length) return;                  /* chưa có bài thì không có gì để phát */
  hideDone();
  initAudio();
  actx.resume();                              /* phải nằm trong user gesture — iOS Safari */
  if (seekOffset >= duration - 0.05) seekOffset = 0;
  if (loopOn() && (seekOffset < loopA || seekOffset >= loopB)) seekOffset = loopA;

  /* Đếm vào: đẩy mốc neo ra tương lai, songTime() sẽ âm trong lúc đếm — nốt vẫn rơi
     sẵn trên màn, chỉ chưa tới vạch. Số phách cắt bớt nếu tempo chậm, đừng để bé
     ngồi chờ 10 giây (Endless Love có đoạn 25 nhịp/phút). */
  let lead = 0;
  if (countIn && notes.length){
    const b = beatAt(seekOffset) / rate;
    let n = barBeats();
    while (n > 2 && n * b > 4) n--;
    for (let k = 0; k < n; k++) click(actx.currentTime + 0.06 + k * b, k === 0);
    lead = 0.06 + n * b;
  }
  startedAt = actx.currentTime + lead;
  schedIdx = lowerBound(seekOffset);
  clickIdx = gridLB(seekOffset);
  playing = true;
  setPanel(false);                            /* nhường chiều cao cho nốt rơi */
  syncPlayBtn();
}
function pause(){
  if (!playing) return;
  const t = songTime();
  playing = false;
  if (t > seekOffset) seekOffset = t;          /* âm = đang đếm vào, giữ nguyên chỗ đứng */
  killVoices();
  savePos();
  syncPlayBtn();                              /* panel KHÔNG tự bung ra: chỉ mở khi bấm tay cầm */
}
function stop(){
  hideDone();
  pause(); seekOffset = 0; schedIdx = 0; clickIdx = 0; lastKeySig = null;
  syncPlayBtn();
}
function seekTo(t){
  hideDone();
  fxSkip = true; parts = []; flashes = [];
  const was = playing; pause();
  seekOffset = Math.max(0, Math.min(t, duration));
  schedIdx = lowerBound(seekOffset);
  clickIdx = gridLB(seekOffset);
  lastKeySig = null;
  if (was) play();
}
/* Đổi ngay ở cuối chuỗi (sau compressor), ramp ngắn cho khỏi "bụp".
   Nốt đã lên lịch vẫn nghe theo mức mới vì gain không nằm trong từng voice. */
function setVolume(pct){
  volume = pct / 100;
  $('volV').textContent = pct + '%';
  if (outGain) outGain.gain.setTargetAtTime(volume, actx.currentTime, 0.02);
}
/* Độ dài một phách quanh thời điểm t — phải tra theo `grid` chứ không dùng hằng số,
   vì có bài đổi tempo tới 19 lần và có đoạn chậm dần còn 25 (Endless Love). */
function beatAt(t){
  if (grid.length < 2) return 0.5;
  const i = Math.min(Math.max(gridLB(t) - 1, 0), grid.length - 2);
  return Math.max(grid[i + 1].sec - grid[i].sec, 0.08);
}
/* Số phách trong một ô nhịp = khoảng cách PHỔ BIẾN NHẤT giữa các vạch ô nhịp.
   Không lấy hai vạch đầu: bài hay mở bằng ô lấy đà. Happy Birthday khai đúng
   1/4 rồi mới 3/4 (ô lấy đà một phách), lấy hai vạch đầu sẽ ra 1 phách/ô. */
function barBeats(){
  const at = [];
  for (let i = 0; i < grid.length; i++) if (grid[i].bar) at.push(i);
  if (at.length < 3) return 4;
  const tally = new Map();
  for (let i = 1; i < at.length; i++){
    const d = at[i] - at[i - 1];
    tally.set(d, (tally.get(d) || 0) + 1);
  }
  let best = 4, n = 0;
  for (const [d, c] of tally) if (c > n){ n = c; best = d; }
  return best;
}
function click(when, accent){
  if (!clickGain) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square';
  o.frequency.value = accent ? 1600 : 1050;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(accent ? 0.42 : 0.26, when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
  o.connect(g).connect(clickGain);
  o.start(when); o.stop(when + 0.08);
}

function setReverb(pct){
  reverb = pct / 100;
  $('revV').textContent = pct + '%';
  if (wetGain) wetGain.gain.setTargetAtTime(reverb, actx.currentTime, 0.05);
}
function setRate(pct){
  const t = songTime();
  rate = pct / 100;
  $('rate').value = pct; $('rateV').textContent = pct + '%';
  killVoices(); anchorAt(t); schedIdx = lowerBound(t);
}

/* ==========================================================================
   10) UI
   ========================================================================== */
$('play').onclick = () => playing ? pause() : play();

/* Panel chỉnh: thu lại khi đang chơi, bấm thanh tay cầm để mở.
   Lúc thu thì in tóm tắt để vẫn biết đang ở tốc độ / tiếng đàn nào. */
function panelSummary(){
  const label = { silent:'chỉ hiện', off:'ẩn' };
  const hands = [];                            /* chỉ nhắc tay nào đang khác "phát" */
  if (handState[0] !== 'on') hands.push('tay phải ' + label[handState[0]]);
  if (handState[1] !== 'on') hands.push('tay trái ' + label[handState[1]]);
  const HINT_SUM = { abs:'số 1–88', deg:'số theo C', off:'không gợi ý' };
  return (HINT_SUM[hintMode] ? HINT_SUM[hintMode] + ' · ' : '') +
         $('rateV').textContent + ' · nhìn ' + $('lookV').textContent +
         ' · vol ' + $('volV').textContent + ' · vang ' + $('revV').textContent +
         ' · ' + $('tone').selectedOptions[0].text.replace(' (2 MB)', '') +
         (hands.length ? ' · ' + hands.join(', ') : '');
}
function setPanel(open){
  $('panel').classList.toggle('collapsed', !open);
  $('grip').setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!open) $('panelSum').textContent = panelSummary();
}
$('grip').onclick = () => { setPanel($('panel').classList.contains('collapsed')); savePrefs(); };
$('again').onclick = () => { seekOffset = 0; schedIdx = 0; play(); };
$('closeDone').onclick = () => hideDone();
$('done').onclick = e => { if (e.target === $('done')) hideDone(); };   /* bấm ra ngoài để đóng */

$('seek').oninput  = e => { dragging = true; const t = e.target.value/1000*duration;
                            $('time').textContent = fmt(t) + ' / ' + fmt(duration); };
$('seek').onchange = e => { dragging = false; seekTo(e.target.value/1000*duration); };

const refreshSum = () => { if ($('panel').classList.contains('collapsed')) $('panelSum').textContent = panelSummary(); savePrefs(); };
for (const id of ['rate','look','vol','rev','tone','hint','fx','lang','cin','met','h0','h1'])
  document.getElementById(id).addEventListener(['tone','hint','fx','lang','cin','met'].includes(id) ? 'change' : 'input', refreshSum);
$('h0').addEventListener('click', refreshSum);
$('h1').addEventListener('click', refreshSum);

$('rate').oninput = e => setRate(+e.target.value);
$('vol').oninput  = e => setVolume(+e.target.value);
$('rev').oninput  = e => setReverb(+e.target.value);

$('tone').onchange = e => {
  tone = e.target.value;
  const u = new URL(location.href);              /* vẫn ghi vào URL để link chia sẻ mang theo
                                                    được lựa chọn, ngoài localStorage */
  if (tone === 'grand') u.searchParams.set('tone', 'grand'); else u.searchParams.delete('tone');
  history.replaceState(null, '', u);
  for (const a of document.querySelectorAll('a[href^="../library/"]'))
    a.href = '../library/' + (tone === 'grand' ? '?tone=grand' : '');
  if (tone === 'grand'){ piano ? toneStatus('sẵn sàng') : loadPiano(); }
  else toneStatus('');
  savePrefs();
};
$('look').oninput = e => { lookahead = +e.target.value; $('lookV').textContent = lookahead + 's'; };
$('hint').onchange = e => { hintMode = e.target.value; syncHintUI(); lastKeySig = null; refreshSum(); };
/* Ô "Tên nốt" (Đô Rê Mi / C D E) chỉ có nghĩa ở chế độ note — chế độ số không dùng
   tên nốt nào cả, nên khoá lại thay vì để người ta đổi mà không thấy gì thay đổi. */
function syncHintUI(){ $('lang').disabled = numMode(); }
$('cin').onchange  = e => { countIn = e.target.checked; savePrefs(); };
$('met').onchange  = e => { metro = e.target.checked; savePrefs(); };
$('fx').onchange   = e => { showFx = e.target.checked; savePrefs(); };
$('scope').onchange = e => { showScope = e.target.checked; lastKeySig = null; savePrefs(); };
$('lang').onchange = e => { noteLang = e.target.value; lastKeySig = null; savePrefs(); };
$('fit').onchange = () => { computeRange(); savePrefs(); };

/* Đổi trạng thái tay: nốt đã lên lịch trước ~100ms nên phải neo lại đồng hồ
   và tính lại schedIdx, nếu không tay vừa tắt vẫn kêu nốt cuối. */
function setHand(h, st){
  handState[h] = st;
  const b = $('h' + h);
  b.dataset.s = st;
  b.querySelector('b').textContent = HAND_LABEL[st];
  b.setAttribute('aria-pressed', st !== 'off');
  lastKeySig = null;
  barIdx = -2;                                 /* tắt một tay là tập phím của ô nhịp đổi */
  if (playing){ const t = songTime(); killVoices(); anchorAt(t); schedIdx = lowerBound(t); clickIdx = gridLB(t); }
}
$('h0').onclick = () => setHand(0, HAND_NEXT[handState[0]]);
$('h1').onclick = () => setHand(1, HAND_NEXT[handState[1]]);

/* Toàn màn hình — iPhone Safari không cho fullscreen phần tử thường, ẩn nút luôn. */
const FS_EXPAND = 'M1 5.6V1.8A.8.8 0 0 1 1.8 1H5.6M10.4 1h3.8a.8.8 0 0 1 .8.8v3.8M15 10.4v3.8a.8.8 0 0 1-.8.8h-3.8M5.6 15H1.8a.8.8 0 0 1-.8-.8v-3.8';
const FS_SHRINK = 'M5.6 1v3.8a.8.8 0 0 1-.8.8H1M11 1v3.8a.8.8 0 0 0 .8.8H15M15 11.4h-3.2a.8.8 0 0 0-.8.8V15M1 11.4h3.2a.8.8 0 0 1 .8.8V15';
const root = document.documentElement;
const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
const inFS  = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

if (canFS){
  $('fs').hidden = false;
  $('fs').onclick = () => {
    if (inFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  };
  const syncFS = () => {
    const on = inFS();
    $('fsIcon').setAttribute('d', on ? FS_SHRINK : FS_EXPAND);
    const t = on ? 'Thoát toàn màn hình' : 'Toàn màn hình';
    $('fs').title = t; $('fs').setAttribute('aria-label', t);
    resize();
  };
  document.addEventListener('fullscreenchange', syncFS);
  document.addEventListener('webkitfullscreenchange', syncFS);
}

$('load').onclick = () => $('file').click();
$('emptyOpen').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };

function readFile(f){
  const r = new FileReader();
  r.onload = () => {
    /* File từ máy không có trong thư viện: xoá currentSong, nếu không savePos()
       sẽ ghi vị trí của file này lên tên bài thư viện đang nhớ, và lần sau mở
       lại sẽ nhảy vào giữa một bài khác. */
    try { currentSong = null; load(parseMidi(r.result), f.name); savePrefs(); }
    catch(err){ $('err').textContent = 'Lỗi: ' + err.message; }
  };
  r.onerror = () => { $('err').textContent = 'Không đọc được file'; };
  r.readAsArrayBuffer(f);
}

/* Nạp bài từ thư viện: /play/?song=ten-file.mid  ->  fetch ../midi/ten-file.mid
   Chỉ nhận tên file thuần để không fetch được URL tuỳ ý hay đi ngược thư mục. */
const SAFE_NAME = /^[A-Za-z0-9._-]+\.midi?$/i;

/* ==========================================================================
   Ghi nhớ lựa chọn + chỗ đang tập dở (localStorage)
   Mở lại lần sau là đúng bài, đúng tốc độ, đúng tiếng đàn, đúng chỗ đang dở.
   Thứ tự ưu tiên khi khởi động: tham số URL > localStorage > mặc định —
   để link chia sẻ (?song=...&tone=grand) vẫn thắng, không bị prefs cũ đè.
   ========================================================================== */
const STORE = 'mypiano.v1';
function loadPrefs(){
  try {
    const p = JSON.parse(localStorage.getItem(STORE)) || {};
    /* Số ngón đã gỡ. savePrefs() ghi kiểu Object.assign lên object cũ nên khoá này
       sẽ nằm lại vĩnh viễn trong máy người đang dùng nếu không dọn ở đây. Xoá được
       dòng này khi tin là không còn máy nào giữ prefs bản cũ. */
    delete p.fing;
    return p;
  } catch(e){ return {}; }
}
function savePrefs(extra){
  try {
    localStorage.setItem(STORE, JSON.stringify(Object.assign(loadPrefs(), {
      v: 1,
      rate: +$('rate').value, look: +$('look').value, vol: +$('vol').value, rev: +$('rev').value,
      tone, fit: $('fit').checked, hint: hintMode, fx: showFx, lang: noteLang, scope: showScope,
      cin: countIn, met: metro,
      hands: handState.slice(),
      panel: !$('panel').classList.contains('collapsed'),
      song: currentSong
    }, extra || {})));
  } catch(e){}                                 /* chế độ riêng tư chặn ghi thì kệ, không phá app */
}
/* Vị trí đang nghe: ghi thưa thôi (2s/lần) cho đỡ đụng đĩa, cộng thêm các mốc quan trọng */
function savePos(){ if (notes.length && currentSong) savePrefs({ pos: Math.max(0, songTime()) }); }
setInterval(() => { if (playing) savePos(); }, 2000);
addEventListener('pagehide', savePos);
addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  savePos();
  /* Tab nền bị trình duyệt bóp setInterval xuống 1 lần/giây (đã đo), scheduler không
     theo kịp và nuốt ~70% số nốt — nghe thành một mớ sai bét. Thà dừng hẳn còn hơn. */
  if (playing) pause();
});

/* Đếm lượt bằng hits.sh: MỖI LẦN ảnh .svg được tải là +1, không có chế độ chỉ-xem.
   Nên badge theo bài chỉ nhúng ở đây — lúc bài thật sự được mở ra để tập.
   Xem thống kê: đổi đuôi .svg thành / trong URL. */
const HITS = 'https://hits.sh/luyentm.github.io/mypiano';
/* URL badge hardcode tên miền thật, nên mở localhost lúc dev cũng +1 và số liệu
   thành vô nghĩa. Chỉ đếm khi đang chạy trên site thật. */
const HITS_LIVE = location.hostname === 'luyentm.github.io';
for (const el of document.querySelectorAll('img[data-hit]')){
  if (HITS_LIVE) el.src = el.dataset.hit; else el.remove();
}
function countSong(file){
  if (!HITS_LIVE){ $('hits').replaceChildren(); return; }
  const a = document.createElement('a');
  a.href = HITS + '/play/' + file + '/';
  a.target = '_blank'; a.rel = 'noopener'; a.title = 'Thống kê lượt tập bài này';
  const img = document.createElement('img');
  img.src = HITS + '/play/' + encodeURIComponent(file) +
            '.svg?style=flat-square&label=' + encodeURIComponent('lượt tập') +
            '&color=edb04a&labelColor=232a38';
  img.alt = 'lượt tập'; img.height = 20;
  a.appendChild(img);
  $('hits').replaceChildren(a);
}

async function loadFromLibrary(fileName){
  if (!SAFE_NAME.test(fileName)){ $('err').textContent = 'Tên file không hợp lệ'; return false; }
  $('busy').classList.add('on');
  try {
    const res = await fetch('../midi/' + encodeURIComponent(fileName));
    if (!res.ok) throw new Error('không tải được (HTTP ' + res.status + ')');
    const meta = await songMeta(fileName);
    load(parseMidi(await res.arrayBuffer()), meta || fileName);
    currentSong = fileName;
    countSong(fileName);
    savePrefs();
    return true;
  } catch(err){
    $('err').textContent = 'Lỗi: ' + err.message;
    return false;
  } finally { $('busy').classList.remove('on'); }
}

/* midi/index.json — đã xếp sẵn từ dễ tới khó. Fetch một lần rồi dùng lại. */
let libCache = null;
async function librarySongs(){
  if (libCache) return libCache;
  try {
    const r = await fetch('../midi/index.json');
    libCache = r.ok ? ((await r.json()).songs || []) : [];
  } catch(e){ libCache = []; }
  return libCache;
}
async function songMeta(fileName){
  const s = (await librarySongs()).find(x => x.file === fileName);
  return s ? (s.composer ? s.title + ' — ' + s.composer : s.title) : null;
}

function showEmpty(h, sub){
  $('emptyH').textContent = h;
  $('emptyS').textContent = sub;
  $('empty').classList.add('on');
}

const drop = $('drop'), stage = $('stage');
stage.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('on'); });
stage.addEventListener('dragleave', () => drop.classList.remove('on'));
stage.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('on');
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  if ((e.key === 'f' || e.key === 'F') && canFS) $('fs').click();
});

/* Khởi động: áp lại tuỳ chọn đã lưu, rồi nạp bài theo thứ tự
   ?song= trong URL > bài đang tập dở > bài DỄ NHẤT trong thư viện. */
const prefs = loadPrefs();
const q = new URLSearchParams(location.search);

/* Thu gọn phím BẬT mặc định, không còn phụ thuộc bề ngang màn. Lý do: iPad ngang
   là 1024px nên trước đây rơi vào nhánh 88 phím — phím trắng chỉ 19.7px, hẹp hơn
   ngón tay trẻ con, mà bài dễ như Happy Birthday chỉ dùng 23 phím. Thu gọn cho
   42.7px, rộng 2.2 lần. */
$('fit').checked = 'fit' in prefs ? !!prefs.fit : true;
/* prefs bản cũ lưu `hint` là boolean. Đổi true -> 'note' (đúng hành vi cũ),
   false -> 'off', chứ không bỏ qua — người đang dùng sẽ mất tuỳ chọn của họ. */
if ('hint' in prefs){
  const h = prefs.hint;
  hintMode = typeof h === 'boolean' ? (h ? 'note' : 'off')
           : ['note','abs','deg','off'].includes(h) ? h : 'note';
  $('hint').value = hintMode;
}
syncHintUI();
if ('fx' in prefs){ showFx = !!prefs.fx; $('fx').checked = showFx; }
if ('scope' in prefs){ showScope = !!prefs.scope; $('scope').checked = showScope; }
if (prefs.lang){ noteLang = prefs.lang; $('lang').value = prefs.lang; }
if ('cin' in prefs){ countIn = !!prefs.cin; $('cin').checked = countIn; }
if ('met' in prefs){ metro = !!prefs.met; $('met').checked = metro; }
if (prefs.rate) setRate(prefs.rate);
if (prefs.look){ lookahead = prefs.look; $('look').value = prefs.look; $('lookV').textContent = prefs.look + 's'; }
if (typeof prefs.vol === 'number'){ $('vol').value = prefs.vol; setVolume(prefs.vol); }
if (typeof prefs.rev === 'number'){ $('rev').value = prefs.rev; setReverb(prefs.rev); }
if (Array.isArray(prefs.hands)) prefs.hands.forEach((st, i) => { if (st) setHand(i, st); });
if (prefs.panel === false) setPanel(false);
if (q.get('tone') === 'grand' || prefs.tone === 'grand'){
  $('tone').value = 'grand';
  $('tone').onchange({ target: $('tone') });
}
syncPlayBtn();
requestAnimationFrame(frame);

(async () => {
  const wanted = q.get('song') || prefs.song;
  const resume = !q.get('song') || q.get('song') === prefs.song;   /* link chỉ đích danh bài khác thì tập lại từ đầu */
  if (wanted){
    if (await loadFromLibrary(wanted)){
      /* chỉ nhảy về chỗ dở khi nó thật sự nằm giữa bài, tránh nhảy vào 2 giây cuối */
      if (resume && prefs.lb > prefs.la) setLoop(prefs.la, prefs.lb, false);
      if (resume && prefs.pos > 3 && prefs.pos < duration - 2) seekTo(prefs.pos);
      return;
    }
    if (q.get('song')){
      showEmpty('Không nạp được bài', 'Thư viện không có "' + wanted + '". Chọn bài khác nhé.');
      return;
    }
  }
  const list = await librarySongs();
  if (list.length && await loadFromLibrary(list[0].file)) return;
  showEmpty(list.length ? 'Không nạp được bài' : 'Thư viện đang trống',
            list.length ? 'Thử chọn bài khác trong thư viện, hoặc mở file .mid từ máy.'
                        : 'Thêm file .mid vào thư viện, hoặc mở một file .mid từ máy bạn.');
})();
</script>
